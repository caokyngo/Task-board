<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Report Bugs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px 16px;
      background: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 900px;
    }

    .btn {
      height: 40px;
      padding: 0 16px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      background-color: #45a049;
    }

    .date-picker-wrapper {
      position: relative;
      width: 200px;
    }

    .date-picker-wrapper input {
      width: 100%;
      height: 40px;
      padding: 0 34px 0 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .calendar-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 18px;
      color: #555;
    }

    #chartContainer {
      width: 100%;
      max-width: 900px;
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    #summaryBox {
      margin-top: 30px;
      max-width: 900px;
      width: 100%;
    }

    #summaryBox h3 {
      margin-bottom: 10px;
    }

    #summaryContent {
      font-family: monospace;
      white-space: pre-wrap;
      background: #f9f9f9;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .controls-row {
        flex-direction: column;
        align-items: stretch;
      }

      .controls-row > * {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Bug Report</h1>

  <div class="controls-row">
    <div class="date-picker-wrapper">
      <input type="text" id="reportDate" placeholder="Chọn ngày" />
      <span class="calendar-icon">📅</span>
    </div>

    <button id="generateBtn" class="btn">Generate Chart</button>
	<button id="backBtn" class="btn">🔙 Quay lại</button>
  </div>

  <div id="chartContainer">
    <canvas id="statusChart"></canvas>
  </div>

  <div id="summaryBox">
    <h3>Tổng hợp Priority theo Status</h3>
    <div id="summaryContent"></div>
  </div>

  <script type="module" src="report.js"></script>
</body>
</html>
