<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Task-Board</title>
  <link rel="icon" href="data:;base64,=" />
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/xlsx.mini.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

</head>

<body>

  <div class="toolbar">
    <h1>Task-Board</h1>
    <button id="reportBtn" class="icon-btn" title="Report">📊</button>
    <button id="exportBtn" class="icon-btn" title="Export">⬇️</button>
    <button id="refreshBtn" class="icon-btn" title="Refresh" data-action="clear">🔄</button>
  </div>

  <div class="controls">
    <input type="text" id="filename" readonly placeholder="Tên file Excel đã chọn" />
    <!-- Button gọi chọn file -->
	<button id="triggerFileBtn" class="btn">Chọn file</button>

<!-- File input ẩn -->
	<input type="file" id="secureFileInput" style="display: none;" />
    <button id="viewBtn" disabled>Xem task to-do</button>
    <button id="addBtn">Thêm mới</button>

    <div id="reportCount"></div>
  </div>

  <!-- Board -->
  <div id="board" class="board"></div>

  <!-- Popups -->

  <!-- Add New Task Popup -->
  <div id="addPopup" class="popup">
    <div class="popup-content">
      <h3>Thêm mới Task</h3>
      <form id="addForm">
        <div class="form-group">
          <label for="newSummary">Summary</label>
          <input type="text" id="newSummary" required />
        </div>
        <div class="form-group">
          <label for="newAssignee">Assignee</label>
           <select id="newAssignee">
            <option value="Trần Cẩm Tuyến">Trần Cẩm Tuyến</option>
            <option value="Lê Hoàng Phương Anh">Lê Hoàng Phương Anh</option>
            <option value="Ngô Lộc">Ngô Lộc</option>
            <option value="Nguyễn Công Hiền">Nguyễn Công Hiền</option>
          </select>
        </div>
        <div class="form-group">
          <label for="newReporter">Reporter</label>
          <select id="newReporter">
            <option value="Phạm Quang Hùng">Phạm Quang Hùng</option>
            <option value="Ngô Cao Kỳ">Ngô Cao Kỳ</option>
            <option value="Trần Trọng Tín">Trần Trọng Tín</option>
            <option value="Nguyễn Thị Anh Thơ">Nguyễn Thị Anh Thơ</option>
          </select>
        </div>
        <div class="form-group">
          <label for="newPriority">Priority</label>
          <select id="newPriority">
            <option value="immediately">Immediately</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="form-group">
          <label for="newModule">Module</label>
         <select id="newModule">
  <option value="">Chọn module</option>
  <option value="37.01_Tổng hợp tiền gửi">37.01_Tổng hợp tiền gửi</option>
  <option value="37.02_CK trong HDBank">37.02_CK trong HDBank</option>
  <option value="37.03_GD chờ duyệt">37.03_GD chờ duyệt</option>
  <option value="37.04_GD của tôi">37.04_GD của tôi</option>
  <option value="37.05_Đăng nhập">37.05_Đăng nhập</option>
  <option value="37.06_Đổi mật khẩu">37.06_Đổi mật khẩu</option>
  <option value="37.07_SEMS_Đăng nhập">37.07_SEMS_Đăng nhập</option>
  <option value="37.08_Quên tên đăng nhập">37.08_Quên tên đăng nhập</option>
  <option value="37.09_Đăng nhập STH_PIN">37.09_Đăng nhập STH_PIN</option>
  <option value="37.10_Gói dịch vụ">37.10_Gói dịch vụ</option>
  <option value="37.11_SEMS_Cấp lại mật khẩu">37.11_SEMS_Cấp lại mật khẩu</option>
  <option value="37.12_SEMS_Mở_Khóa TK người dùng">37.12_SEMS_Mở_Khóa TK người dùng</option>
  <option value="37.13_SEMS_Batchjob">37.13_SEMS_Batchjob</option>
  <option value="37.14_SEMS_Nhật ký GD">37.14_SEMS_Nhật ký GD</option>
  <option value="37.15_SEMS_Duyệt GD BCT">37.15_SEMS_Duyệt GD BCT</option>
  <option value="37.17_PTXT">37.17_PTXT</option>
  <option value="37.18_Biến động số dư">37.18_Biến động số dư</option>
  <option value="37.19_SEMS_Ma trận phân quyền SEMS">37.19_SEMS_Ma trận phân quyền SEMS</option>
  <option value="37.20_SEMS_Ma trận phân quyền KHDN">37.20_SEMS_Ma trận phân quyền KHDN</option>
  <option value="37.21_SEMS_Hợp đồng">37.21_SEMS_Hợp đồng</option>
  <option value="37.22_SEMS_Phí ưu đãi theo AccType">37.22_SEMS_Phí ưu đãi theo AccType</option>
  <option value="37.23_SEMS_Hạn mức theo GD">37.23_SEMS_Hạn mức theo GD</option>
  <option value="37.24_SEMS_Hạn mức theo PTXT">37.24_SEMS_Hạn mức theo PTXT</option>
  <option value="37.25_SEMS_QL mẫu Email">37.25_SEMS_QL mẫu Email</option>
  <option value="37.26_SEMS_QL mẫu SMS">37.26_SEMS_QL mẫu SMS</option>
  <option value="37.27_SEMS_QL mẫu biến động số dư">37.27_SEMS_QL mẫu biến động số dư</option>
  <option value="37.28_SEMS_QL tin tức">37.28_SEMS_QL tin tức</option>
  <option value="37.29_SEMS_Nhật ký hệ thống">37.29_SEMS_Nhật ký hệ thống</option>
  <option value="37.30_SEMS_Phiên đăng nhập">37.30_SEMS_Phiên đăng nhập</option>
  <option value="37.31_SEMS_DS tiền tệ">37.31_SEMS_DS tiền tệ</option>
  <option value="37.32_SEMS_Báo cáo hệ thống">37.32_SEMS_Báo cáo hệ thống</option>
  <option value="37.33_SEMS_Tham số hệ thống">37.33_SEMS_Tham số hệ thống</option>
  <option value="37.34_Trang chủ">37.34_Trang chủ</option>
  <option value="37.35_Đa ngôn ngữ">37.35_Đa ngôn ngữ</option>
  <option value="37.36_SEMS_Gói phí">37.36_SEMS_Gói phí</option>
  <option value="37.37_SEMS_Biểu phí">37.37_SEMS_Biểu phí</option>
  <option value="PILOT_1.1">PILOT_1.1</option>
  <option value="MIGARTION">MIGARTION</option>
</select>

        </div>
        <div class="form-group">
          <label for="newDescription">Description</label>
          <textarea id="newDescription" rows="4"></textarea>
        </div>
        <button type="submit" class="popup-btn">Thêm</button>
        <button type="button" class="popup-close" onclick="toggleAddPopup(false)">Hủy</button>
      </form>
    </div>
  </div>

<!-- Popup đăng nhập -->
<div id="loginPopup" class="popup login-popup">
  <div class="popup-content">
    <h2>🔐 Xác thực hành động</h2>
    <p>Vui lòng nhập thông tin để tiếp tục</p>

    <div class="form-group">
      <label for="loginUsername">Tên đăng nhập</label>
	   <div class="input-wrapper">
      <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập" />
	  </div>
    </div>

    <div class="form-group">
      <label for="loginPassword">Mật khẩu</label>
      <div class="input-wrapper">
  <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" />
  <i id="togglePassword" class="fas fa-eye icon-eyes"></i> 
</div>
    </div>

    <div class="popup-actions">
      <button id="loginConfirmBtn" class="btn primary">✅ Xác nhận</button>
      <button id="closeLoginPopup" class="btn">❌ Đóng</button>
    </div>
  </div>
</div>




<!-- Edit Task Popup (đặt trong index.html) -->
<div id="editPopup" class="modal-overlay">
  <div class="modal-card">
    <header class="modal-header">
      <h2>Chỉnh sửa Task</h2>
      <button class="modal-close">&times;</button>
    </header>
    <form id="editForm" class="modal-body">
      <div class="form-grid">
        <label>
          Issue Key
          <input id="editIssueKey" readonly style="pointer-events: none; background-color: #eee;" />
        </label>
        <label>
          Summary
          <input type="text" id="editSummary" required>
        </label>
        <label>
          Assignee
          <input type="text" id="editAssignee">
        </label>
        <label>
          Reporter
          <input type="text" id="editReporter">
        </label>
        <label>
          Priority
          <select id="editPriority">
            <option value="immediately">Immediately</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label class="full-width">
          Module
          <select id="editModule">
            <!-- options -->
          </select>
        </label>
        <label class="full-width">
          Description
          <textarea id="editDescription" rows="4"></textarea>
        </label>
      </div>
      <footer class="modal-footer">
        <button type="submit" class="btn btn-primary">Cập nhật</button>
        <button type="button" id="editCancelBtn" class="btn btn-secondary">Hủy</button>
      </footer>
    </form>
  </div>
</div>



  <!-- Description Popup -->
  <div id="descriptionPopup" class="popup">
    <div class="popup-content">
      <h3>Mô tả chi tiết</h3>
      <p id="descriptionText"></p>
      <button type="button" class="popup-close">Đóng</button>

    </div>
  </div>

  <div id="exportPopup" class="popup">
    <div class="popup-content">
      <p>Bạn muốn xuất dữ liệu hiện tại sang file Excel?</p>
      <button id="exportYes">Xuất Excel</button>
      <button id="exportNo">Hủy</button>
    </div>
  </div>

  <div id="reportPopup" class="popup">
    <div class="popup-content">
      <h3>Chọn loại report</h3>
      <div class="popup-buttons">
        <button class="popup-btn" data-mode="day">Theo ngày</button>
        <button class="popup-btn" data-mode="all">Tất cả</button>
      </div>
      <button class="popup-close" onclick="document.getElementById('reportPopup').classList.remove('show')">Đóng</button>
    </div>
  </div>

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />

 <script type="module" src="script.js"></script>
</body>
</html>
