<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Task-Board</title>
  <link rel="icon" href="data:;base64,=" />
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/xlsx.mini.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

</head>

<body>

  <div class="toolbar">
    <h1>Task-Board</h1>
    <button id="reportBtn" class="icon-btn" title="Report">📊</button>
    <button id="exportBtn" class="icon-btn" title="Export">⬇️</button>
    <button id="refreshBtn" class="icon-btn" title="Refresh" data-action="clear">🔄</button>
  </div>

  <div class="controls">
    <input type="text" id="filename" readonly placeholder="Tên file Excel đã chọn" />
    <!-- Button gọi chọn file -->
	<button id="triggerFileBtn" class="btn">Chọn file</button>

<!-- File input ẩn -->
	<input type="file" id="secureFileInput" style="display: none;" />
   <!--  <button id="viewBtn" disabled>Xem task to-do</button> -->
    <button id="addBtn">Thêm mới</button>

    <div id="reportCount"></div>
  </div>

  <!-- Board -->
  <div id="board" class="board"></div>

  <!-- Popups -->

  <!-- Add New Task Popup -->
  <div id="addPopup" class="popup">
  <div class="popup-content">
    <h2>➕ Thêm mới Task</h2>
    <form id="addForm" class="styled-form">
      <div class="form-group">
        <label>Summary</label>
        <input type="text" id="newSummary" placeholder="Tóm tắt nội dung task" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Assignee</label>
          <input type="text" id="newAssignee" placeholder="Người được giao" />
        </div>
        <div class="form-group">
          <label>Reporter</label>
          <input type="text" id="newReporter" placeholder="Người báo cáo" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Priority</label>
          <select id="newPriority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div class="form-group">
          <label>Module</label>
		  <select id="newModule">
            <option value="">[No Module]</option>
<option>37.01_Tổng hợp tiền gửi</option>
<option>37.02_CK trong HDBank</option>
<option>37.03_GD chờ duyệt</option>
<option>37.04_GD của tôi</option>
<option>37.05_Đăng nhập</option>
<option>37.06_Đổi mật khẩu</option>
<option>37.07_SEMS_Đăng nhập</option>
<option>37.08_Quên tên đăng nhập</option>
<option>37.09_Đăng nhập STH_PIN</option>
<option>37.10_Gói dịch vụ</option>
<option>37.11_SEMS_Cấp lại mật khẩu</option>
<option>37.12_SEMS_Mở_Khóa TK người dùng</option>
<option>37.13_SEMS_Batchjob</option>
<option>37.14_SEMS_Nhật ký GD</option>
<option>37.15_SEMS_Duyệt GD BCT</option>
<option>37.17_PTXT</option>
<option>37.18_Biến động số dư</option>
<option>37.19_SEMS_Ma trận phân quyền SEMS</option>
<option>37.20_SEMS_Ma trận phân quyền KHDN</option>
<option>37.21_SEMS_Hợp đồng</option>
<option>37.22_SEMS_Phí ưu đãi theo AccType</option>
<option>37.23_SEMS_Hạn mức theo GD</option>
<option>37.24_SEMS_Hạn mức theo PTXT</option>
<option>37.25_SEMS_QL mẫu Email</option>
<option>37.26_SEMS_QL mẫu SMS</option>
<option>37.27_SEMS_QL mẫu biến động số dư</option>
<option>37.28_SEMS_QL tin tức</option>
<option>37.29_SEMS_Nhật ký hệ thống</option>
<option>37.30_SEMS_Phiên đăng nhập</option>
<option>37.31_SEMS_DS tiền tệ</option>
<option>37.32_SEMS_Báo cáo hệ thống</option>
<option>37.33_SEMS_Tham số hệ thống</option>
<option>37.34_Trang chủ</option>
<option>37.35_Đa ngôn ngữ</option>
<option>37.36_SEMS_Gói phí</option>
<option>37.37_SEMS_Biểu phí</option>
<option>PILOT_1.1</option>
<option>MIGARTION</option>

          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="newDescription" rows="4" placeholder="Mô tả chi tiết task"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn primary">✔️ Tạo mới</button>
        <button type="button" class="btn" onclick="toggleAddPopup(false)">❌ Hủy</button>
      </div>
    </form>
  </div>
</div>


<!-- Popup đăng nhập -->
<div id="loginPopup" class="popup login-popup">
  <div class="popup-content">
    <h2>🔐 Xác thực hành động</h2>
    <p>Vui lòng nhập thông tin để tiếp tục</p>

    <div class="form-group">
      <label for="loginUsername">Tên đăng nhập</label>
	   <div class="input-wrapper">
      <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập" />
	  </div>
    </div>

    <div class="form-group">
      <label for="loginPassword">Mật khẩu</label>
      <div class="input-wrapper">
  <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" />
  <i id="togglePassword" class="fas fa-eye icon-eyes"></i> 
</div>
    </div>

    <div class="popup-actions">
      <button id="loginConfirmBtn" class="btn primary">✅ Xác nhận</button>
      <button id="closeLoginPopup" class="btn">❌ Đóng</button>
    </div>
  </div>
</div>




<!-- Edit Task Popup (đặt trong index.html) -->
<div id="editPopup" class="modal-overlay">
  <div class="modal-card">
    <header class="modal-header">
      <h2>Chỉnh sửa Task</h2>
      <button class="modal-close">&times;</button>
    </header>
    <form id="editForm" class="modal-body">
      <div class="form-grid">
        <label>
          Issue Key
          <input id="editIssueKey" readonly style="pointer-events: none; background-color: #eee;" />
        </label>
        <label>
          Summary
          <input type="text" id="editSummary" required>
        </label>
        <label>
          Assignee
          <input type="text" id="editAssignee">
        </label>
        <label>
          Reporter
          <input type="text" id="editReporter">
        </label>
        <label>
          Priority
          <select id="editPriority">
            <option value="immediately">Immediately</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label class="full-width">
          Module
          <select id="editModule">
            <!-- options -->
          </select>
        </label>
        <label class="full-width">
          Description
          <textarea id="editDescription" rows="4"></textarea>
        </label>
      </div>
      <footer class="modal-footer">
        <button type="submit" class="btn btn-primary">Cập nhật</button>
        <button type="button" id="editCancelBtn" class="btn btn-secondary">Hủy</button>
      </footer>
    </form>
  </div>
</div>



  <!-- Description Popup -->
  <div id="descriptionPopup" class="popup">
    <div class="popup-content">
      <h3>Mô tả chi tiết</h3>
      <p id="descriptionText"></p>
      <button type="button" class="popup-close">Đóng</button>

    </div>
  </div>

  <div id="exportPopup" class="popup">
    <div class="popup-content">
      <p>Bạn muốn xuất dữ liệu hiện tại sang file Excel?</p>
      <button id="exportYes">Xuất Excel</button>
      <button id="exportNo">Hủy</button>
    </div>
  </div>

  <div id="reportPopup" class="popup">
    <div class="popup-content">
      <h3>Chọn loại report</h3>
      <div class="popup-buttons">
        <button class="popup-btn" data-mode="day">Theo ngày</button>
        <button class="popup-btn" data-mode="all">Tất cả</button>
      </div>
      <button class="popup-close" onclick="document.getElementById('reportPopup').classList.remove('show')">Đóng</button>
    </div>
  </div>

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />

 <script type="module" src="script.js"></script>
</body>
</html>
